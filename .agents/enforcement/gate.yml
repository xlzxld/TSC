# tsc-managed —— 本文件由 tsc 技能托管：上游模板更新时会被自动覆盖；项目自己的修改会被冲掉。若要接管，请删除本标记行并自行维护。
name: gate
on:
  pull_request:
    # 改成你的主干分支名（供 §2「主干分支」那一行取值）
    # 注意：`tsc.py install` 会自动把这里替换成 AGENTS.md §2 里的主干分支名
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0        # 密钥扫描要翻历史，必须取全量

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # 按项目技术栈补充运行时安装，例如：
      #   - uses: actions/setup-node@v4
      #     with: { node-version: 20 }

      # 密钥扫描：直接用 gitleaks 官方 action 扫全历史。
      # 不用 pre-commit 跑这一步——那里的 gitleaks 只扫暂存内容，
      # 在 CI 上等于只扫本次改动的文件，翻不出仓库里已有的旧密钥。
      - name: 密钥扫描 (gitleaks, 全历史)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 提交信息规范：只有存在本地钩子配置且装了依赖时才校验。
      # 没配就明确跳过（不会让 CI 误判为失败）。
      - name: 提交信息规范 (commitlint)
        if: ${{ hashFiles('.pre-commit-config.yaml', 'commitlint.config.js') != '' }}
        run: |
          npm i -D @commitlint/cli@21.2.2 @commitlint/config-conventional@21.2.2
          npx --no -- @commitlint/cli --from "${{ github.event.pull_request.base.sha || github.event.before }}" --to "${{ github.sha }}" --verbose

      # 聚合门禁：读 .agents/project.py（唯一命令源），逐条执行。
      # 内联实现而不是调 .agents/tsc.py——执行逻辑常驻技能目录、不进项目，
      # CI runner 上没有技能目录，也不该为此引入对私有技能仓库的 token 依赖。
      - name: 聚合门禁 (fmt-check / lint / test / build)
        run: |
          python3 - <<'PYEOF'
          import subprocess, sys
          from pathlib import Path

          cfg = Path(".agents/project.py")
          if not cfg.is_file():
              print("找不到 .agents/project.py，门禁无法执行", file=sys.stderr)
              sys.exit(3)
          ns = {"__file__": str(cfg.resolve())}
          exec(compile(cfg.read_text(encoding="utf-8"), str(cfg), "exec"), ns)

          # 同源校验：AGENTS.md §2 与 .agents/project.py 必须一致。
          # 判定逻辑与本地 `tsc.py check-config` 同源（两套执行壳，一个命令源）。
          ROW_TO_KEY = {"格式化": "FMT_CHECK_CMD", "静态检查": "LINT_CMD", "测试": "TEST_CMD", "构建": "BUILD_CMD"}
          def split_row(line):
              text = line.strip()
              if text.startswith("|"):
                  text = text[1:]
              if text.endswith("|"):
                  text = text[:-1]
              cells, cur, esc = [], [], False
              for ch in text:
                  if esc:
                      cur.append(ch)
                      esc = False
                  elif ch == "\\":
                      cur.append(ch)
                      esc = True
                  elif ch == "|":
                      cells.append("".join(cur).strip())
                      cur = []
                  else:
                      cur.append(ch)
              cells.append("".join(cur).strip())
              return cells
          def norm(v):
              if v is None:
                  return "无"
              return str(v).strip().strip("`").strip().replace("\\|", "|")
          agents_path = Path("AGENTS.md")
          block = None
          if agents_path.is_file():
              lines = agents_path.read_text(encoding="utf-8").split("\n")
              start = None
              for i, ln in enumerate(lines):
                  if ln.startswith("## 2."):
                      start = i
                      break
              if start is not None:
                  end = len(lines)
                  for j in range(start + 1, len(lines)):
                      if lines[j].startswith("## "):
                          end = j
                          break
                  block = "\n".join(lines[start:end])
          if block is None:
              print("AGENTS.md 缺少 §2，同源校验与门禁无法执行", file=sys.stderr)
              sys.exit(1)
          table = {}
          for line in block.split("\n"):
              s = line.strip()
              if not s.startswith("|"):
                  continue
              cells = split_row(s)
              if len(cells) < 2 or (cells and "".join(cells) and set("".join(cells)) <= set("-: ")):
                  continue
              for prefix, key in ROW_TO_KEY.items():
                  if cells[0].startswith(prefix) and key not in table:
                      table[key] = cells[1]
          if any("[自动填充]" in v for v in table.values()):
              # §2 尚未适配（项目还没填）：跳过同源校验，让"零门禁 rc=3"给出更可行动的信号
              print("§2 仍是 [自动填充] 占位（项目未适配），跳过同源校验")
          else:
              mismatch = []
              for key in ("FMT_CHECK_CMD", "LINT_CMD", "TEST_CMD", "BUILD_CMD"):
                  expected = norm(ns[key]) if key in ns else "（未定义该变量）"
                  actual = norm(table.get(key, "（§2 缺该行）"))
                  print(f"{key:<14} project.py={expected:<40} §2={actual}")
                  if expected != actual:
                      mismatch.append(key)
              if mismatch:
                  print(f"不一致：{'、'.join(mismatch)} —— AGENTS.md §2 与 .agents/project.py 必须同源",
                        file=sys.stderr)
                  sys.exit(1)
              print("同源校验：AGENTS.md §2 与 .agents/project.py 一致")

          steps = [
              ("格式化 (Format)", "FMT_CHECK_CMD"),
              ("静态检查 (Lint)", "LINT_CMD"),
              ("测试 (Test)", "TEST_CMD"),
              ("构建 (Build)", "BUILD_CMD"),
          ]
          ran = 0
          for label, key in steps:
              command = ns.get(key)
              if command in (None, "", "skip"):
                  print(f"skip: {label}（未配置）")
                  continue
              ran += 1
              print(f"$ {command}")
              code = subprocess.run(command, shell=True).returncode
              print(f"  退出码：{code}")
              if code != 0:
                  print(f"{label} 未通过，停在此处。门禁结论：失败（退出码 {code}）")
                  sys.exit(code)
          if ran == 0:
              # 与本地 tsc.py verify 同口径：全未配置是假绿，不是通过
              print("四条门禁命令均未配置，本次没有真正执行任何检查——这个\"全绿\"是假绿，"
                    "未配置不是通过。请编辑 .agents/project.py（与 AGENTS.md §2 同步）。",
                    file=sys.stderr)
              sys.exit(3)
          print("门禁结论：全绿（退出码 0）")
          PYEOF
